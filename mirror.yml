name: Mirror X to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the last-seen tweet ID

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror new posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mirror.py

      - name: Save last-seen tweet ID
        run: |
          if [ -n "$(git status --porcelain .last_tweet_id 2>/dev/null)" ]; then
            git config user.name "mirror-bot"
            git config user.email "actions@github.com"
            git add .last_tweet_id
            git commit -m "chore: advance last-seen tweet ID [skip ci]"
            git push
          fi
