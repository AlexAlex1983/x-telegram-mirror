name: Mirror X to Telegram

on:
  schedule:
    - cron: "*/600 * * * *"   # every 600 minutes
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the last-seen tweet ID

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror new posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mirror.py

      - name: Save mirror state
        run: |
          git config user.name "mirror-bot"
          git config user.email "actions@github.com"
          FILES=""
          [ -f .last_tweet_id ] && FILES="$FILES .last_tweet_id"
          [ -f .daily_state.json ] && FILES="$FILES .daily_state.json"
          if [ -n "$FILES" ]; then
            git add $FILES
            if ! git diff --cached --quiet; then
              git commit -m "chore: update mirror state [skip ci]"
              git push
            fi
          fi
